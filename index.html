<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A3A">
<title>جدول القراءة — السادس الابتدائي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --bg:#F6F1E8; --card:#FFFDF8; --line:#E4DACA; --soft:#EFE8DB; --muted:#5B6668; --ink:#1E2A2B;
  --deep:#1E3A3A; --deep2:#2A4B4A; --deep3:#2F5553; --amber:#F0B37E; --teal:#0E6B63; --tealbg:#E2F0EA;
  --warn:#9A3412; --warnbg:#FBE3D3; --err:#B42318; --errbg:#FDE7E4;
  --math:#2563A8; --ar:#0E6B63; --en:#7C3AED; --sci:#B45309; --isl:#15803D; --soc:#BE185D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
h1,h2,h3{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:96px}
.pad{padding:20px 18px 0}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}.xs{font-size:11px}
.b{font-weight:700}
.title{font-family:'Reem Kufi',sans-serif;font-size:28px;font-weight:700;line-height:1.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;font-weight:700;background:var(--teal);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.amber{background:var(--amber);color:var(--deep)}
.btn:disabled{background:#D9D0C0;color:#6B6458;cursor:not-allowed}
.seg{display:grid;gap:4px;padding:4px;background:#EAE2D4;border-radius:12px}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(30,42,43,.15)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bar{height:8px;border-radius:8px;background:#EAE2D4;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px}
.nav{position:fixed;bottom:0;left:0;right:0;height:76px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:520px;margin:0 auto;display:contents}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.nav button.on{color:var(--teal);font-weight:700}
.sess{display:flex;gap:10px;align-items:center;min-height:62px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.sess.fixed{background:#EFE8DB;border-color:transparent}
.sess.done{opacity:.72}
.sess .t{width:58px;flex-shrink:0;font-size:12px;color:var(--muted);line-height:1.35;white-space:pre-line}
.sess .stripe{width:4px;align-self:stretch;border-radius:4px}
.ic{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.hero{background:var(--deep);color:#F6F1E8;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{background:#FFF4D6;border:1px solid #F0D48A;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.7}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:20px;color:var(--teal)}
.msg{padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;line-height:1.6}
.msg.ok{background:var(--tealbg);color:var(--teal)}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.err{background:var(--errbg);color:var(--err)}
.subj{display:flex;flex-direction:column;gap:6px;text-align:right;padding:12px;min-height:76px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.lesson{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:right;width:100%}
.pageimg{width:100%;display:block;border-radius:10px;border:1px solid #DCD1BE;background:#fff;min-height:200px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;padding:8px 14px;border-radius:12px;font-size:15px;text-align:right;background:var(--bg);border:1px solid var(--line);width:100%}
.opt.right{background:var(--tealbg);border-color:var(--teal);color:var(--teal)}
.opt.wrong{background:var(--errbg);border-color:var(--err);color:var(--err)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex-shrink:0;min-width:64px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;padding:0 10px}
.tabs button.on{background:var(--math);border-color:var(--math);color:#fff;font-weight:700}
.tabs button.ok{border-color:var(--teal);color:var(--teal)}
.overlay{position:fixed;inset:0;background:rgba(20,28,28,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.zoom{position:fixed;inset:0;background:#111;z-index:60;overflow:auto}
.zoom img{width:200%;max-width:none;display:block}
.zoom .close{position:fixed;top:12px;left:12px;width:48px;height:48px;border-radius:14px;border:0;background:#fff;font-size:22px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input.in,select.in,textarea.in{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;width:100%}
textarea.in{resize:vertical;line-height:1.6}
.word{min-height:40px;padding:0 8px;border-radius:8px;border:0;background:transparent;font-family:'Nunito',sans-serif;font-size:20px;font-weight:700}
.word.on{background:var(--en);color:#fff}
.word.saved{background:#EDE7F9}
.en{font-family:'Nunito',sans-serif}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:70;max-width:90%}
.offline{background:var(--warnbg);color:var(--warn);font-size:12px;text-align:center;padding:6px}
.role{min-height:100vh;background:var(--deep);color:#F6F1E8;padding:64px 22px 32px;display:flex;flex-direction:column;gap:28px}
.rolebtn{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;border:0;text-align:right;width:100%}
.mom-head{background:var(--deep);color:#F6F1E8;padding:22px 18px 20px;display:flex;flex-direction:column;gap:14px}
.stat{padding:12px;border-radius:14px;background:var(--deep2);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px}
.stat span{font-size:12px;color:#C9D6D3}
.pill{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.hw{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
@media (min-width:560px){.nav{left:50%;transform:translateX(-50%);width:520px;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* ================== الإعدادات ================== */
const DB_ROOT = 'https://jadwal-almanzil-default-rtdb.firebaseio.com/g6';
const FAM_HOME = 'bayt';          // رمز عائلة البيت — يشير للبيانات الأصلية بدون نقل
let DB = DB_ROOT;                 // يتحدد بعد معرفة رمز العائلة
const LS = 'g6:';
/* رمز العائلة: كل عائلة لها فرع مستقل بقاعدة البيانات */
function cleanFam(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24) || null; }
function setDB(fam){ DB = (fam === FAM_HOME) ? DB_ROOT : DB_ROOT + '/f/' + fam; }
function getFam(){
  const q = cleanFam(new URLSearchParams(location.search).get('f'));
  if (q) { lsSet('fam', q); try { history.replaceState(null, '', location.pathname); } catch(e){} return q; }
  return lsGet('fam', null);
}
function registerFam(fam){
  const now = Date.now();
  const body = { last: now };
  if (!lsGet('famReg', false)) { body.first = now; lsSet('famReg', true); }
  const nm = lsGet('famName', ''); if (nm) body.name = nm;
  fetch(DB_ROOT + '/families/' + encodeURIComponent(fam) + '.json',
        { method: 'PATCH', body: JSON.stringify(body) }).catch(() => {});
}
const SUBJ = {
  math:{n:'الرياضيات', c:'#2563A8'}, ar:{n:'اللغة العربية', c:'#0E6B63'}, en:{n:'اللغة الإنكليزية', c:'#7C3AED'},
  sci:{n:'العلوم', c:'#B45309'}, isl:{n:'التربية الإسلامية', c:'#15803D'}, soc:{n:'الاجتماعيات', c:'#BE185D'},
  gram:{n:'قواعد اللغة العربية', c:'#0F766E'}
};
const BOOKS = { isl:{file:'data/isl.json', img:'pages/isl/p'}, ar:{file:'data/ar.json', img:'pages/ar/p'}, math:{file:'data/math.json', img:'pages/math/p'}, sci:{file:'data/sci.json', img:'pages/sci/p'}, soc:{file:'data/soc.json', img:'pages/soc/p'}, gram:{file:'data/gram.json', img:'pages/gram/p'}, en:{file:'data/en.json', img:'pages/en/p'} }; // الكتب المضافة لحد الآن
const TYPES = { off:'تحضير / عطلة', am:'صباحي', pm:'مسائي' };
const SCHOOL = { off:null, am:[480,720], pm:[750,990] };  // بالدقائق من منتصف الليل
const DEF_TIMES = {
  off:[[960,60],[1035,45],[1095,45],[1170,45],[1230,45]],
  am: [[900,60],[975,45],[1035,45],[1140,45],[1200,45]],
  pm: [[510,60],[585,45],[645,45],[1080,45],[1140,45]]
};
const SLOT_SUBJ = { off:['math','ar','en','sci'], am:['math','ar','sci','en'], pm:['math','ar','en','sci'] };
let TOTAL = 240, SLEEP = 1380, LAST_END = 1305, EARLIEST = 420;
const DEF_TOTAL = 240, DEF_SLEEP = 1380, DEF_EARLIEST = 420;
const BUFFER = 30, PASS = 0.7;
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

/* ================== الإعدادات المتقدمة (Advanced Settings) ================== */
function getAdvSettings(){ return lsGet('adv_settings', { total: DEF_TOTAL, sleep: DEF_SLEEP, earliest: DEF_EARLIEST, theme: 'dark' }); }
function setAdvSettings(s){ lsSet('adv_settings', s); applyAdv(s); render(); }
function applyAdv(s){ TOTAL = s.total; SLEEP = s.sleep; EARLIEST = s.earliest; LAST_END = SLEEP - 75; applyTheme(s.theme); }
function applyTheme(theme){
  const root = document.documentElement;
  if (theme === 'light') {
    root.style.setProperty('--bg', '#FFFFFF');
    root.style.setProperty('--card', '#F9F7F4');
    root.style.setProperty('--line', '#E0D9CC');
    root.style.setProperty('--muted', '#6B7280');
    root.style.setProperty('--ink', '#111827');
    root.style.setProperty('--deep', '#FFFFFF');
  } else {
    root.style.setProperty('--bg', '#F6F1E8');
    root.style.setProperty('--card', '#FFFDF8');
    root.style.setProperty('--line', '#E4DACA');
    root.style.setProperty('--muted', '#5B6668');
    root.style.setProperty('--ink', '#1E2A2B');
    root.style.setProperty('--deep', '#1E3A3A');
  }
}
/* إعدادات الأم توصل لجهاز البنت (ماعدا شكل الواجهة — يبقى لكل جهاز) */
function syncAdvFromCloud(){
  const c = getIn(S, '/settings/adv'); if (!c) return;
  const l = getAdvSettings();
  if (c.total === l.total && c.sleep === l.sleep && c.earliest === l.earliest) return;
  const m = { total: c.total || l.total, sleep: c.sleep || l.sleep, earliest: c.earliest || l.earliest, theme: l.theme };
  lsSet('adv_settings', m); applyAdv(m);
}

/* ================== أدوات ================== */
const AR = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m/60), mm = m%60; return AR((h%12||12) + ':' + String(mm).padStart(2,'0')); };
const dur = m => AR(Math.floor(m/60) + ':' + String(m%60).padStart(2,'0'));
/* نص المدة بالعربي: ٤ ساعات / ساعتين ونص / ٣ ساعات و١٥ دقيقة */
function hrsTxt(m){
  const h = Math.floor(m/60), mm = m%60;
  let t = h === 0 ? '' : h === 1 ? 'ساعة' : h === 2 ? 'ساعتين' : h <= 10 ? AR(h) + ' ساعات' : AR(h) + ' ساعة';
  if (mm) { const p = mm === 30 ? 'نص' : AR(mm) + ' دقيقة'; t = t ? t + ' و' + p : p; }
  return t || '٠';
}
const totalTxt = () => hrsTxt(TOTAL);
const pad2 = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const clockOf = ts => { const d = new Date(ts); return fmt(d.getHours()*60 + d.getMinutes()); };
const dayName = d => DAYS[d.getDay()] + ' ' + AR(d.getDate()) + ' ' + MONTHS[d.getMonth()];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lsGet = (k, d) => { try { const v = localStorage.getItem(LS+k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(LS+k, JSON.stringify(v)); } catch(e) {} };
function hash(s){ let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffled(arr, seed){ const a = arr.map((x,i) => [x,i]); let s = seed || 1; for (let i = a.length-1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i+1); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function daysBetween(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 86400000); }

/* ================== البيانات ================== */
let S = lsGet('state', {}) || {};
const role = () => lsGet('role', null);
let online = navigator.onLine;
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

function setIn(obj, path, val){
  const parts = path.split('/').filter(Boolean); let o = obj;
  for (let i = 0; i < parts.length-1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length-1];
  if (val === null || val === undefined) delete o[last]; else o[last] = val;
}
function getIn(obj, path){ return path.split('/').filter(Boolean).reduce((o,k) => (o && typeof o === 'object') ? o[k] : undefined, obj); }

const queue = lsGet('queue', []);
async function flush(){
  while (queue.length) {
    const [method, path, val] = queue[0];
    try {
      const r = await fetch(DB + path + '.json', { method, body: method === 'DELETE' ? undefined : JSON.stringify(val) });
      if (!r.ok) throw new Error(r.status);
      queue.shift(); lsSet('queue', queue);
    } catch(e) { online = false; render(); return; }
  }
}
function put(path, val){
  setIn(S, path, val); lsSet('state', S);
  queue.push([val === null ? 'DELETE' : 'PUT', path, val]); lsSet('queue', queue);
  flush(); render();
}
function logEvent(text){ put('/log/' + uid(), { at: Date.now(), text, by: role() }); }

function listen(){
  try {
    const es = new EventSource(DB + '.json');
    const apply = (e, patch) => {
      const d = JSON.parse(e.data); if (!d) return;
      if (patch) { for (const [k,v] of Object.entries(d.data || {})) setIn(S, (d.path === '/' ? '' : d.path) + '/' + k, v); }
      else if (d.path === '/') { S = d.data || {}; queue.forEach(([m, p, v]) => setIn(S, p, m === 'DELETE' ? null : v)); }
      else setIn(S, d.path, d.data);
      if (!queue.length) { lsSet('state', S); }
      syncAdvFromCloud();
      online = true; render();
    };
    es.addEventListener('put', e => apply(e, false));
    es.addEventListener('patch', e => apply(e, true));
    es.onerror = () => { online = false; render(); };
    es.onopen = () => { online = true; flush(); };
  } catch(e) {}
}
window.addEventListener('online', () => { online = true; flush(); render(); });
window.addEventListener('offline', () => { online = false; render(); });

/* ================== الكتب ================== */
const BOOK = {};
async function loadBooks(){
  for (const [k,b] of Object.entries(BOOKS)) {
    try { const r = await fetch(b.file); BOOK[k] = await r.json(); } catch(e) {}
  }
  render();
}
function lessonsOf(sub){ const b = BOOK[sub]; return b ? Object.entries(b).map(([id,l]) => ({ id, ...l })) : []; }
function lessonQs(l){ const out = []; for (let p = l.from; p <= l.to; p++) (l.q[p] || []).forEach((q,i) => out.push({ page:p, i, key:p+'_'+i, q })); return out; }
function lessonScore(sub, l){
  const ans = getIn(S, `/quiz/${sub}/${l.id}/a`) || {}; const qs = lessonQs(l);
  let n = 0, ok = 0; qs.forEach(x => { if (ans[x.key]) { n++; if (ans[x.key].ok) ok++; } });
  return { n, ok, total: qs.length, done: n === qs.length && qs.length > 0, pct: n ? ok/n : 0 };
}
function lessonDone(sub, l){ return !!getIn(S, `/quiz/${sub}/${l.id}/done`); }
function currentLesson(sub){ return lessonsOf(sub).find(l => !lessonDone(sub, l)); }
function dueReviews(sub, today){
  return lessonsOf(sub).filter(l => { const r = getIn(S, `/quiz/${sub}/${l.id}/review`); return r && r <= today; });
}

/* ================== الجدول ================== */
const settings = () => S.settings || {};
function typeOf(key){
  const ov = getIn(S, '/overrides/' + key); if (ov) return ov;
  const st = settings().start; if (!st || key < st) return 'off';
  const w = settings().week || {}; return w[parseKey(key).getDay()] || 'off';
}
function timesOf(type){ const t = getIn(S, '/times/' + type); return (Array.isArray(t) && t.length === 5) ? t : DEF_TIMES[type]; }
/* تكبير/تصغير الجلسات تلقائياً لما تتغير ساعات القراءة — نحافظ على الفواصل بين الجلسات */
function rescaleTimes(oldTotal, newTotal){
  if (!oldTotal || oldTotal === newTotal) return;
  for (const type of ['off','am','pm']) {
    const t = timesOf(type).map(x => x.slice());
    const gaps = t.map((x,i) => i === 0 ? 0 : x[0] - (t[i-1][0] + t[i-1][1]));
    const lens = t.map(x => Math.max(15, Math.round(x[1] * newTotal / oldTotal / 5) * 5));
    let diff = newTotal - lens.reduce((a,b) => a+b, 0);
    for (let n = 0; diff !== 0 && n < 400; n++) {
      const k = n % 5, step = diff > 0 ? 5 : -5;
      if (lens[k] + step >= 15 && lens[k] + step <= 120) { lens[k] += step; diff -= step; }
    }
    const out = []; let cur = t[0][0];
    for (let j = 0; j < 5; j++) { if (j) cur += gaps[j]; out.push([cur, lens[j]]); cur += lens[j]; }
    put('/times/' + type, out);
  }
}
function subjectsOf(type, key){
  const alt = (parseKey(key).getTime() / 86400000 | 0) % 2 === 0 ? 'isl' : 'soc';
  return [...SLOT_SUBJ[type], alt];
}
function planOf(key){
  const type = typeOf(key), times = timesOf(type), subs = subjectsOf(type, key);
  const rows = times.map((t,i) => ({ i, start:t[0], len:t[1], sub:subs[i] }));
  const sch = SCHOOL[type];
  const blocks = rows.map(r => ({ kind:'s', ...r }));
  if (sch) blocks.push({ kind:'school', start:sch[0], len:sch[1]-sch[0] });
  blocks.push({ kind:'sleep', start:SLEEP, len:0 });
  blocks.sort((a,b) => a.start - b.start);
  return { type, rows, blocks };
}
function validate(times, type){
  const sch = SCHOOL[type]; let total = 0; const errs = [];
  times.forEach((x,i) => {
    const st = x[0], en = x[0] + x[1]; let err = ''; total += x[1];
    if (st < EARLIEST) err = 'قبل ' + fmt(EARLIEST) + ' الصبح';
    else if (en > LAST_END) err = 'تنتهي بعد ' + fmt(LAST_END) + ' — قريبة من وقت النوم';
    else if (sch && st < sch[1] + BUFFER && en > sch[0] - BUFFER) err = 'تتعارض مع الدوام (مع نص ساعة قبله وبعده)';
    else for (let j = 0; j < times.length; j++) if (j !== i && st < times[j][0] + times[j][1] && en > times[j][0]) { err = 'تتداخل مع جلسة ثانية'; break; }
    errs.push(err);
  });
  return { total, errs, ok: total === TOTAL && errs.every(e => !e) };
}

/* ---------- الإنكليزي ---------- */
const trCache = lsGet('tr', {});
async function translate(text){
  const k = text.trim().toLowerCase(); if (!k) return '';
  if (trCache[k]) return trCache[k];
  let out = '';
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=' + encodeURIComponent(text));
    const j = await r.json(); out = (j[0] || []).map(x => x[0]).join('');
  } catch(e) {
    try { const r = await fetch('https://api.mymemory.translated.net/get?langpair=en|ar&q=' + encodeURIComponent(text)); const j = await r.json(); out = j.responseData.translatedText; } catch(e2) {}
  }
  if (out) { trCache[k] = out; lsSet('tr', trCache); }
  return out;
}
function speak(text){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .85; speechSynthesis.speak(u); } catch(e) { toast('الصوت مو مدعوم بهذا الجهاز'); } }
const wkey = w => w.toLowerCase().replace(/[^a-z']/g,'');
let enTimer = null;

async function refreshTranslation(){
  const t = ui.enText.trim(); const out = document.getElementById('enTr'); const box = document.getElementById('enOut');

}

      <div class="col g10">
        <label class="f">🕐 وقت النوم<div class="row g4"><input class="in" id="sleepIn" type="time" value="${String(Math.floor(SLEEP/60)).padStart(2,'0')}:${String(SLEEP%60).padStart(2,'0')}" style="flex:1"><button class="btn ghost" data-act="resetSleep" style="min-height:40px">أرجع للافتراضي</button></div></label>
        <label class="f">⏱️ إجمالي وقت القراءة اليومي <span class="xs muted">(بالدقائق — حالياً ${totalTxt()})</span><div class="row g4"><input class="in" id="totalIn" type="number" min="120" max="480" step="15" value="${TOTAL}" style="flex:1"><button class="btn ghost" data-act="resetTotal" style="min-height:40px">أرجع</button></div></label>
        <label class="f">🌅 أول وقت مسموح<div class="row g4"><input class="in" id="earliestIn" type="time" value="${String(Math.floor(EARLIEST/60)).padStart(2,'0')}:${String(EARLIEST%60).padStart(2,'0')}" style="flex:1"><button class="btn ghost" data-act="resetEarliest" style="min-height:40px">أرجع</button></div></label>
        <label class="f">🎨 الواجهة<div class="seg" style="grid-template-columns:repeat(2,1fr)"><button class="${ui.advTheme === 'dark' ? 'on' : ''}" data-act="setTheme" data-v="dark">🌙 Dark</button><button class="${ui.advTheme === 'light' ? 'on' : ''}" data-act="setTheme" data-v="light">☀️ Light</button></div></label>
      </div>
      <button class="btn amber grow" style="height:44px" data-act="saveAdvSettings">حفظ الإعدادات</button>
      <span class="xs muted" style="line-height:1.7">لمن تغيّرين وقت القراءة، الجلسات الخمس تنعدّل أطوالها تلقائياً. وقت النوم والقراءة يوصلون لجهاز البنت. شكل الواجهة يخص جهازك بس — البنت ماتشوف هذا الخيار.</span>
      <div class="row between" style="border-top:1px solid var(--line);padding-top:10px"><span class="small muted">🔒 الرمز السري لواجهة الأم</span><button class="btn ghost" style="min-height:36px;font-size:12px" data-act="pinChange">تغيير الرمز</button></div>
      <div class="row between"><span class="small muted">رمز العائلة: <b>${esc(lsGet('fam','—'))}</b></span><button class="btn ghost" style="min-height:36px;font-size:12px" data-act="switchFam">تبديل الرمز</button></div>
    </div>
  </div>`;
}

/* ---------- الطبقات (نوافذ) ---------- */
function layer(){
  const L = document.getElementById('layer'); let h = '';
  if (ui.pinSet) h = `<div class="overlay"><div class="sheet col g12" data-stop="1">
    <h2>رمز واجهة الأم</h2>
    <span class="small muted" style="line-height:1.8">اختاري رمزاً من ٤ أرقام. راح يُطلب كل مرة يدخل بيها أحد على واجهة الأم — حتى البنت ما تقدر تفتحها وتغيّر الإعدادات.</span>
    <input class="in" id="pin1" type="password" inputmode="numeric" maxlength="8" placeholder="الرمز الجديد" style="text-align:center;font-size:20px;letter-spacing:6px;height:52px">
    <input class="in" id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="أعيدي كتابته" style="text-align:center;font-size:20px;letter-spacing:6px;height:52px">
    <div class="row g8"><button class="btn grow" data-act="pinSetSave">حفظ ودخول</button><button class="btn ghost" data-act="pinCancel">إلغاء</button></div>
    <span class="xs muted">احفظي الرمز — لو نسيتيه يتصفّر من صفحة الإدارة.</span></div></div>`;
  else if (ui.pinAsk) h = `<div class="overlay"><div class="sheet col g12" data-stop="1">
    <h2>واجهة الأم</h2>
    <span class="small muted">اكتبي الرمز السري للدخول.</span>
    <input class="in" id="pinIn" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autofocus style="text-align:center;font-size:24px;letter-spacing:8px;height:56px">
    ${ui.pinAsk.tries ? `<span class="small" style="color:var(--err)">الرمز غلط — محاولة ${AR(ui.pinAsk.tries)}</span>` : ''}
    <div class="row g8"><button class="btn grow" data-act="pinCheck">دخول</button><button class="btn ghost" data-act="pinCancel">رجوع</button></div></div></div>`;
  else if (ui.zoom) h = `<div class="zoom" data-act="zoomOff"><button class="close" data-act="zoomOff" aria-label="إغلاق">✕</button><img src="${ui.zoom}" alt=""></div>`;
  else if (ui.hwForm) h = `<div class="overlay" data-act="sheetOff"><div class="sheet col g12" data-stop="1"><h2>واجب جديد</h2>
    <label class="f">المادة<select class="in" id="hwSub">${Object.entries(SUBJ).map(([k,s]) => `<option value="${k}">${s.n}</option>`).join('')}</select></label>
    <label class="f">الواجب<input class="in" id="hwDesc" placeholder="مثلاً: حل تمارين صفحة ١٢"></label>
    <label class="f">موعد التسليم<input class="in" id="hwDue" type="date" value="${dkey(new Date(Date.now()+86400000))}"></label>
    <label class="f">الوقت المتوقع (دقائق)<input class="in" id="hwMins" type="number" min="5" step="5" value="20"></label>
    <div class="row g8"><button class="btn grow" data-act="hwSave">إضافة</button><button class="btn ghost" data-act="sheetOff">إلغاء</button></div></div></div>`;
  else if (ui.enWord) { const k = ui.enWord, w = (S.words||{})[k]; h = `<div class="overlay" data-act="sheetOff"><div class="sheet col g12" data-stop="1" style="background:#2E1F55;color:#F6F2FD">
    <div class="row g12"><div class="grow col g4"><b class="en" dir="ltr" style="font-size:30px;text-align:right">${esc(k)}</b></div><button class="ic" style="width:52px;height:52px;border-radius:14px;background:var(--amber)" data-act="speak" data-v="${esc(k)}" aria-label="استماع">${svg('speak',24,'#2E1F55')}</button></div>
    <div id="wordTr" style="font-size:24px;font-weight:700">${esc(w ? w.ar : (trCache[k] || '…'))}</div>
    <div class="row g8"><button class="btn grow" style="background:#3B2A6B;border:1px solid #5A4790" data-act="${w?'delWord':'saveWord'}" data-v="${esc(k)}">${w?'محفوظة — إزالة من كلماتي':'+ احفظي الكلمة'}</button><button class="btn" style="background:transparent;border:1px solid #5A4790" data-act="sheetOff">إغلاق</button></div></div></div>`; }
  else if (ui.wq) { const q = ui.wq; h = `<div class="overlay"><div class="sheet col g12" data-stop="1"><div class="row between"><h2>اختبري نفسك</h2><span class="small muted">${AR(q.i+1)} من ${AR(q.items.length)} · صح ${AR(q.ok)}</span></div>
    <b class="en" dir="ltr" style="font-size:30px;text-align:center;display:block">${esc(q.items[q.i].en)}</b>
    ${q.items[q.i].opts.map((o,oi) => `<button class="opt ${q.pick!=null?(o===q.items[q.i].ar?'right':oi===q.pick?'wrong':''):''}" data-act="wqPick" data-v="${oi}">${esc(o)}</button>`).join('')}
    <div class="row g8">${q.pick!=null?`<button class="btn grow" data-act="wqNext">${q.i<q.items.length-1?'التالي':'إنهاء'}</button>`:''}<button class="btn ghost" data-act="wqOff">إغلاق</button></div></div></div>`; }
  L.innerHTML = h;
}

/* ================== الأحداث ================== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'sheetOff' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const a = el.dataset.act, v = el.dataset.v, key = dkey(new Date());
  switch (a) {
    case 'famSave': {
      const c = cleanFam(document.getElementById('famIn').value);
      if (!c || c.length < 3) { toast('اكتب رمزاً من ٣ حروف فأكثر (إنكليزي وأرقام)'); break; }
      const nm = (document.getElementById('famNameIn').value || '').trim().slice(0, 40);
      lsSet('fam', c); if (nm) lsSet('famName', nm);
      setDB(c); registerFam(c);
      S = {}; lsSet('state', S);          // نبدأ نظيف، والبيانات تنزل من السحابة
      loadBooks(); listen(); flush(); render();
      break; }
    case 'switchFam': {
      if (!confirm('تبديل رمز العائلة؟ راح يطلب منك الرمز من جديد على هذا الجهاز.')) break;
      lsSet('fam', null); lsSet('role', null); lsSet('famReg', false);
      S = {}; lsSet('state', S); location.reload(); break; }
    case 'role': {
      if (v !== 'mom') { lsSet('role', v); view = 'today'; render(); registerFam(lsGet('fam', FAM_HOME)); break; }
      let pin = getIn(S, '/settings/pin');
      if (pin === undefined || pin === null) {          // ممكن البيانات ما نزلت بعد — نسأل السحابة مباشرة
        try { const r = await fetch(DB + '/settings/pin.json'); pin = await r.json(); } catch(e) { pin = undefined; }
      }
      if (pin) { ui.pinAsk = { tries: 0 }; layer(); }
      else ui.pinSet = true, layer();
      break; }
    case 'pinCancel': ui.pinAsk = null; ui.pinSet = null; layer(); break;
    case 'pinSetSave': {
      const a = (document.getElementById('pin1').value || '').replace(/\D/g,'');
      const b = (document.getElementById('pin2').value || '').replace(/\D/g,'');
      if (a.length < 4) { toast('الرمز لازم ٤ أرقام على الأقل'); break; }
      if (a !== b) { toast('الرمزان مو متطابقين'); break; }
      put('/settings/pin', a);
      ui.pinSet = null; lsSet('role', 'mom'); view = 'today'; layer(); render();
      registerFam(lsGet('fam', FAM_HOME)); toast('✅ انحفظ الرمز السري');
      break; }
    case 'pinCheck': {
      const v2 = (document.getElementById('pinIn').value || '').replace(/\D/g,'');
      let pin = getIn(S, '/settings/pin');
      if (pin === undefined || pin === null) { try { const r = await fetch(DB + '/settings/pin.json'); pin = await r.json(); } catch(e){} }
      if (String(v2) === String(pin)) {
        ui.pinAsk = null; lsSet('role', 'mom'); view = 'today'; layer(); render();
        registerFam(lsGet('fam', FAM_HOME));
      } else {
        ui.pinAsk.tries++; layer();
        toast(ui.pinAsk.tries >= 3 ? 'الرمز غلط — راجعي الأم' : 'الرمز غلط');
      }
      break; }
    case 'pinChange': {
      const a = prompt('الرمز السري الجديد (٤ أرقام أو أكثر):');
      if (a === null) break;
      const c = String(a).replace(/\D/g,'');
      if (c.length < 4) { toast('الرمز لازم ٤ أرقام على الأقل'); break; }
      put('/settings/pin', c); toast('✅ تغيّر الرمز السري'); break; }
    case 'switchRole': lsSet('role', null); ui.momDay = null; render(); break;
    case 'go': go(v); if (v === 'en') setTimeout(refreshTranslation, 0); break;
    case 'dayType': { const cur = typeOf(key); if (cur === v) break; put('/overrides/' + key, v); logEvent('غيّرت نوع يوم ' + dayName(new Date()) + ' إلى: ' + TYPES[v]); break; }
    case 'start': { const i = +el.dataset.i; put(`/days/${key}/s/${i}/st`, Date.now()); break; }
    case 'finish': { const i = +el.dataset.i, p = `/days/${key}/s/${i}`; const r = getIn(S, p) || {}; if (!r.st) { if (!confirm('ما بدأتِ هذي الجلسة بالزر. تأشّريها خالصة؟ (الماما تشوف إنها ما انبدأت بالوقت)')) break; } put(p + '/dn', Date.now()); toast('عفية! الجلسة خلصت'); break; }
    case 'undo': { const i = +el.dataset.i; put(`/days/${key}/s/${i}/dn`, null); break; }
    case 'openSub': if (v === 'en') { go('en'); setTimeout(refreshTranslation, 0); } else if (BOOK[v]) { const rev = dueReviews(v, key)[0], cur = rev || currentLesson(v); ui.sub = v; if (cur) { ui.lesson = { sub:v, id:cur.id }; ui.page = null; view = 'books'; window.scrollTo(0,0); render(); } else go('books'); } else { ui.sub = v; go('books'); } break;
    case 'editType': ui.editType = v; ui.draft = null; render(); break;
    case 'tstep': { const i = +el.dataset.i, k = +el.dataset.k, d = +el.dataset.d; const t = ui.draft.t[i]; t[k] += d; if (k === 1) t[1] = Math.max(15, Math.min(120, t[1])); ui.draft.saved = false; render(); break; }
    case 'resetTimes': ui.draft.t = DEF_TIMES[ui.draft.type].map(x => x.slice()); ui.draft.saved = false; render(); break;
    case 'saveTimes': { const d = ui.draft; const old = timesOf(d.type); const subs = subjectsOf(d.type, key); const ch = d.t.map((x,i) => (x[0]!==old[i][0]||x[1]!==old[i][1]) ? `${i===4?'الجلسة الخامسة':SUBJ[subs[i]].n}: ${fmt(x[0])} لمدة ${dur(x[1])}` : '').filter(Boolean);
      put('/times/' + d.type, d.t.map(x => x.slice())); if (ch.length) logEvent('غيّرت أوقات يوم «' + TYPES[d.type] + '» — ' + ch.join('، ') + ' (المجموع ' + totalTxt() + ')'); d.saved = true; render(); break; }
    case 'weekDay': { const d = el.dataset.d; put('/settings/week/' + d, v); logEvent('يوم ' + DAYS[d] + ' صار: ' + TYPES[v]); break; }
    case 'pickSub': ui.sub = v; render(); break;
    case 'openLesson': ui.lesson = { sub: el.dataset.sub, id: el.dataset.id }; ui.page = null; window.scrollTo(0,0); render(); break;
    case 'closeLesson': ui.lesson = null; window.scrollTo(0,0); render(); break;
    case 'page': ui.page = +v; window.scrollTo(0,0); render(); break;
    case 'zoom': ui.zoom = v; layer(); break;
    case 'zoomOff': ui.zoom = null; layer(); break;
    case 'answer': {
      if (el.getAttribute('aria-disabled')) break;
      const { sub, id } = ui.lesson, l = lessonsOf(sub).find(x => x.id === id); const k = el.dataset.k, o = +el.dataset.o;
      const [pg, qi] = k.split('_').map(Number); const q = l.q[pg][qi]; const ok = o === q[2];
      const base = `/quiz/${sub}/${id}`;
      put(base + '/a/' + k, { pick:o, ok, at:Date.now() }); put(base + '/at', Date.now());
      const sc = lessonScore(sub, l);
      if (sc.done && !lessonDone(sub, l)) {
        put(base + '/done', Date.now());
        if (sc.pct < PASS) { const d = new Date(); d.setDate(d.getDate()+3); put(base + '/review', dkey(d)); }
        logEvent(`خلصت درس «${l.t}» — ${AR(sc.ok)} من ${AR(sc.total)}`);
      } else if (sc.done && getIn(S, base + '/review') && getIn(S, base + '/retry')) {
        if (sc.pct >= PASS) put(base + '/review', null); else { const d = new Date(); d.setDate(d.getDate()+3); put(base + '/review', dkey(d)); }
        put(base + '/retry', null); logEvent(`راجعت درس «${l.t}» — ${AR(sc.ok)} من ${AR(sc.total)}`);
      }
      break; }
    case 'retry': { const { sub, id } = ui.lesson; put(`/quiz/${sub}/${id}/a`, null); put(`/quiz/${sub}/${id}/retry`, true); if (!getIn(S, `/quiz/${sub}/${id}/review`)) put(`/quiz/${sub}/${id}/review`, key); ui.page = null; window.scrollTo(0,0); render(); break; }
    case 'speak': speak(v); break;
    case 'word': ui.enWord = v; layer(); if (!(S.words||{})[v]) { const r = await translate(v); const w = document.getElementById('wordTr'); if (w && ui.enWord === v) w.textContent = r || 'ما وصلت الترجمة — تأكدي من النت'; } break;
    case 'saveWord': { const ar = trCache[v] || await translate(v); if (!ar) { toast('لازم نت حتى تنحفظ الترجمة'); break; } put('/words/' + v, { en:v, ar, at:Date.now() }); ui.enWord = null; toast('انحفظت بكلماتي'); break; }
    case 'delWord': put('/words/' + v, null); ui.enWord = null; break;
    case 'sheetOff': ui.enWord = null; ui.hwForm = null; layer(); break;
    case 'wordQuiz': { const ws = Object.values(S.words||{}); const items = shuffled(ws, Date.now() & 0xffff).slice(0,10).map(([w]) => ({ en:w.en, ar:w.ar, opts: shuffled([w.ar, ...shuffled(ws.filter(x => x.ar !== w.ar), Date.now() & 0xfff).slice(0,3).map(([x]) => x.ar)], hash(w.en)).map(([x]) => x) })); ui.wq = { items, i:0, ok:0, pick:null }; layer(); break; }
    case 'wqPick': { const q = ui.wq; if (q.pick != null) break; q.pick = +v; if (q.items[q.i].opts[q.pick] === q.items[q.i].ar) q.ok++; layer(); break; }
    case 'wqNext': { const q = ui.wq; if (q.i < q.items.length-1) { q.i++; q.pick = null; } else { logEvent(`اختبار كلمات الإنكليزي: ${AR(q.ok)} من ${AR(q.items.length)}`); toast(`النتيجة ${AR(q.ok)} من ${AR(q.items.length)}`); ui.wq = null; } layer(); break; }
    case 'wqOff': ui.wq = null; layer(); break;
    case 'hwDone': put(`/homework/${el.dataset.id}/done`, true); logEvent('أنجزت واجب: ' + ((S.homework||{})[el.dataset.id]||{}).desc); break;
    case 'hwNew': ui.hwForm = true; layer(); break;
    case 'hwSave': { const desc = document.getElementById('hwDesc').value.trim(); if (!desc) { toast('اكتبي الواجب'); break; } put('/homework/' + uid(), { sub: document.getElementById('hwSub').value, desc, due: document.getElementById('hwDue').value, mins: +document.getElementById('hwMins').value || 0, done:false, at:Date.now() }); ui.hwForm = null; layer(); break; }
    case 'hwDel': if (confirm('حذف الواجب؟')) put('/homework/' + el.dataset.id, null); break;
    case 'saveNote': put('/note', { text: document.getElementById('noteIn').value.trim(), at: Date.now() }); toast('انحفظت الملاحظة'); break;
    case 'clearNote': put('/note', null); break;
    case 'momDay': ui.momDay = v; render(); break;
    case 'setTheme': { const s = getAdvSettings(); if (s.theme === v) break; s.theme = v; setAdvSettings(s); toast(v === 'light' ? '☀️ واجهة فاتحة' : '🌙 واجهة داكنة'); break; }
    case 'resetSleep': { const s = getAdvSettings(); s.sleep = DEF_SLEEP; setAdvSettings(s); put('/settings/adv', s); toast('رجع وقت النوم ١١:٠٠ مساءً'); break; }
    case 'resetTotal': { const s = getAdvSettings(), o = s.total; s.total = DEF_TOTAL; setAdvSettings(s); put('/settings/adv', s); if (o !== DEF_TOTAL) rescaleTimes(o, DEF_TOTAL); toast('رجعت ٤ ساعات — وانعدّل الجدول'); break; }
    case 'resetEarliest': { const s = getAdvSettings(); s.earliest = DEF_EARLIEST; setAdvSettings(s); put('/settings/adv', s); toast('رجع أول وقت ٧:٠٠ صباحاً'); break; }
    case 'saveAdvSettings': {
      const sleepStr = (document.getElementById('sleepIn')?.value || '23:00').split(':');
      const sleep = +sleepStr[0] * 60 + +sleepStr[1];
      const total = +document.getElementById('totalIn').value;
      const earliestStr = (document.getElementById('earliestIn')?.value || '07:00').split(':');
      const earliest = +earliestStr[0] * 60 + +earliestStr[1];
      if (!(total >= 120 && total <= 480)) { toast('ساعات القراءة لازم بين ١٢٠ و٤٨٠ دقيقة'); break; }
      if (sleep - 75 <= earliest) { toast('وقت النوم لازم يكون بعد أول وقت مسموح'); break; }
      const s = getAdvSettings(), oldTotal = s.total;
      s.sleep = sleep; s.total = total; s.earliest = earliest;
      setAdvSettings(s);
      put('/settings/adv', s);
      if (oldTotal !== total) rescaleTimes(oldTotal, total);
      logEvent(`تعديل الإعدادات: النوم ${fmt(sleep)}، القراءة ${totalTxt()}، أول وقت ${fmt(earliest)}`);
      toast(oldTotal !== total ? '✅ انحفظت — وانعدّل الجدول تلقائياً' : '✅ تم حفظ الإعدادات');
      break;
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'startDate') { put('/settings/start', e.target.value || null); logEvent('بداية الدوام: ' + (e.target.value ? dayName(parseKey(e.target.value)) : 'بدون')); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'enIn') {
    ui.enText = e.target.value; clearTimeout(enTimer);
    enTimer = setTimeout(() => { const pos = e.target.selectionStart; render(); const t = document.getElementById('enIn'); if (t) { t.focus(); t.setSelectionRange(pos, pos); } refreshTranslation(); }, 700);
  }
});

/* ================== التشغيل ================== */
(function boot(){
  const fam = getFam();
  applyAdv(getAdvSettings());
  if (fam) { setDB(fam); registerFam(fam); render(); loadBooks(); listen(); flush(); }
  else render();
})();
setInterval(() => { if (!document.activeElement || !['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName)) render(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
